name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Download and optimize local images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run prepare:images
      - name: Upload image preparation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-preparation-report
          path: |
            image-preparation-report.md
            image-preparation-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-site
          path: |
            .
            !.git/**
            !node_modules/**
            !test-results/**
          retention-days: 1
          include-hidden-files: true

  unit:
    name: Data and image integrity tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prepared-site
          path: .
      - run: node --test

  browser:
    name: Browser tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prepared-site
          path: .
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-site
          path: site
      - uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact to be visible to the Pages API
        run: sleep 30
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
