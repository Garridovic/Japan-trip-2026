name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Download and optimize local images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock
      # Photos come from Wikimedia Commons and take 3-4 min to download and convert. They only change when the
      # catalogs, the place data or the script change, so the result is cached under a key made from those files.
      - name: Compute the photo cache key (before the script rewrites details.json)
        id: key
        run: echo "key=photos-${{ hashFiles('data/journey.json', 'data/cities/*/image-catalog.json', 'data/cities/*/places.json', 'data/cities/*/details.json', 'scripts/prepare-images.js') }}" >> "$GITHUB_OUTPUT"
      - name: Restore prepared photos
        id: photos
        uses: actions/cache/restore@v5
        with:
          path: |
            assets/images
            data/cities/*/details.json
            data/cities/*/image-credits.json
            image-preparation-report.json
            image-preparation-report.md
          key: ${{ steps.key.outputs.key }}
      - name: Download and optimize local images (only when the cache missed)
        if: steps.photos.outputs.cache-hit != 'true'
        run: npm run prepare:images
      - name: Save prepared photos only when every photo was found
        if: steps.photos.outputs.cache-hit != 'true' && hashFiles('image-preparation-report.json') != ''
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('image-preparation-report.json','utf8'));process.exit(r.issues.length?1:0)" \
            && echo "SAVE_PHOTOS=true" >> "$GITHUB_ENV" || echo "Report has warnings: not caching this result."
      - name: Save photo cache
        if: env.SAVE_PHOTOS == 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            assets/images
            data/cities/*/details.json
            data/cities/*/image-credits.json
            image-preparation-report.json
            image-preparation-report.md
          key: ${{ steps.key.outputs.key }}
      - name: Build the offline manifest (service worker file list and version)
        run: npm run build:offline
      - name: Upload image preparation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-preparation-report
          path: |
            image-preparation-report.md
            image-preparation-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-site
          path: |
            .
            !.git/**
            !node_modules/**
            !test-results/**
          retention-days: 1
          include-hidden-files: true

  unit:
    name: Data and image integrity tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: prepared-site
          path: .
      - run: node --test

  browser:
    name: Browser tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: prepared-site
          path: .
      - run: npm install --no-package-lock
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-site
          path: site
      - uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Wait for artifact to be visible to the Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[]|select(.name=="github-pages")]|length' || echo 0)
            [ "$n" -gt 0 ] && exit 0
            sleep 4
          done
          echo "github-pages artifact still not listed; trying the deployment anyway."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
